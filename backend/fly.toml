# Fly.io config for the Mosaic Go backend (WebSocket hub).
# Rename `app` to a globally-unique name, then: fly launch --no-deploy (first
# time) or fly deploy. Set secrets with `fly secrets set` (see DEPLOYMENT.md).
app = "mosaic-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true          # browsers will connect over wss://
  auto_stop_machines = "stop" # scale to zero when idle (an open WS keeps it up)
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
